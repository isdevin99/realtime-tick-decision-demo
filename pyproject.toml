[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-tick-decision-demo"
version = "0.1.0"
description = "A small offline example for explainable decisions from normalized trade ticks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Example Contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["tickdemo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
